<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lulu - music discovery platform</title>
<meta name="description" content="A music discovery platform. Follow Lulu the cat through her day, from blues to ambient, metal, hip-hop, ghazal and jazz.">
<meta name="theme-color" content="#14100d">
<meta property="og:title" content="Lulu - music discovery platform">
<meta property="og:description" content="A music discovery platform. Follow Lulu the cat through her day, from blues to ambient, metal, hip-hop, ghazal and jazz.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://lulu-fm.vercel.app/">
<meta property="og:image" content="https://lulu-fm.vercel.app/img/share.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Lulu, a white cat, watching rain on a window">
<meta property="og:site_name" content="Lulu">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Lulu - music discovery platform">
<meta name="twitter:description" content="A music discovery platform. Follow Lulu the cat through her day, from blues to ambient, metal, hip-hop, ghazal and jazz.">
<meta name="twitter:image" content="https://lulu-fm.vercel.app/img/share.jpg">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500&display=swap">
<link rel="stylesheet" href="site.css">
</head>
<body>
<main class="stage" id="stage" aria-label="Lulu">
  <div class="frames" id="frames"></div>
  <div class="scrim" aria-hidden="true"></div>

  <button class="edge edge-l" id="prevScene" type="button" aria-label="Previous scene"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4l-8 8 8 8" /></svg></button>
  <button class="edge edge-r" id="nextScene" type="button" aria-label="Next scene"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4l8 8-8 8" /></svg></button>

  <section class="ui" id="ui" aria-label="Music">
    <div class="dock" id="dock">
      <div class="more" id="more">
        <div class="seek">
          <span class="time" id="tCur">0:00</span>
          <input class="range" id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek">
          <span class="time" id="tDur">0:00</span>
        </div>
        <div class="controls">
          <button class="ctl" id="prevBtn" type="button" aria-label="Previous track" title="Previous track"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5.5v13l-9-6.5zM5.5 5H8v14H5.5z"/></svg></button>
          <button class="ctl" id="nextBtn" type="button" aria-label="Next track" title="Next track"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5.5v13l9-6.5zM16.5 5H19v14h-2.5z"/></svg></button>
          <div class="vol">
            <button class="ctl" id="muteBtn" type="button" aria-label="Mute" title="Mute">
              <svg class="i-vol" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5l4.5 3.8V5.7L7.5 9.5zM15 9a4 4 0 010 6M17.3 6.7a7.3 7.3 0 010 10.6" class="stroke"/></svg>
              <svg class="i-mute" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5l4.5 3.8V5.7L7.5 9.5zM15.5 9.5l5 5M20.5 9.5l-5 5" class="stroke"/></svg>
            </button>
            <input class="range vol-range" id="vol" type="range" min="0" max="100" value="80" step="1" aria-label="Volume">
          </div>
          <button class="ctl" id="vidBtn" type="button" aria-label="Show video" aria-pressed="false" title="Show video"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 6.5h13v11h-13zM16.5 10.5l4-2.5v8l-4-2.5z"/></svg></button>
          <a class="ctl" id="ytLink" href="https://www.youtube.com/" target="_blank" rel="noopener" aria-label="Open on YouTube" title="Open on YouTube"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5H5v14h14v-4M13 5h6v6M19 5l-8 8" class="stroke"/></svg></a>
        </div>
      </div>
      <div class="mini">
        <button class="play" id="playBtn" type="button" aria-label="Play" aria-pressed="false" title="Play / pause">
          <svg class="ring" viewBox="0 0 36 36" aria-hidden="true"><circle class="ring-bg" cx="18" cy="18" r="16.5"/><circle class="ring-fg" id="ring" cx="18" cy="18" r="16.5"/></svg>
          <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6.5v11l9-5.5z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 6.5h2.6v11H8.5zM13 6.5h2.6v11H13z"/></svg>
        </button>
        <p class="now" id="now" aria-live="polite"><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span><span id="nowText"></span></p>
        <button class="more-btn" id="moreBtn" type="button" aria-label="More controls" aria-expanded="false" title="More controls"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 14l6-6 6 6"/></svg></button>
      </div>
    </div>
  </section>

  <section class="enter" id="enter" aria-labelledby="enterTitle">
    <div class="enter-inner">
      <h1 id="enterTitle">Lulu</h1>
      <p class="tag">A music discovery platform.</p>
      <button class="enter-btn" id="enterBtn" type="button">Enter</button>
      <p class="hint">Sound on.</p>
    </div>
  </section>

  <div class="yt-host" id="ytHost"><div id="yt"></div></div>
</main>
<noscript><p class="nojs">Lulu needs JavaScript to show its scenes and play music.</p></noscript>
<script src="app.js"></script>
</body>
</html>
